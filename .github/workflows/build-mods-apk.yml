name: Build Horizon Android APK with All 7 Mods

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-mods-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Android fork (Rayan-XOO/horizon)
        uses: actions/checkout@v4
        with:
          path: horizon-android-fork

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config zip unzip rsync python3

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Rust stable + aarch64-linux-android + cargo-ndk
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Setup Android SDK 35 & NDK 27.2.12479018
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "platform-tools"

      - name: Clone Upstream Horizon (142388e1), horizon-mixins & All 7 Mods
        run: |
          git clone https://github.com/horizon-rust/horizon.git workspace-clean
          git -C workspace-clean fetch origin 142388e1c136e622652ec7505af15d8ad195e041
          git -C workspace-clean checkout -B android-modded 142388e1c136e622652ec7505af15d8ad195e041

          git clone https://github.com/horizon-rust/horizon-mixins.git horizon-mixins
          git -C horizon-mixins checkout 0d6b103c70633d8fd9443d8d0acd3aadaacedb06
          cargo build --release --locked --manifest-path horizon-mixins/Cargo.toml -p horizon-mixins-cli

          mkdir -p mods-stage/mixins
          for repo in d3grando/treefall d3grando/carryblock d3grando/biomecompass d3grando/smartf3 horizon-rust/horizon-mod-fps-overlay; do
            name=$(basename "$repo")
            git clone "https://github.com/$repo.git" "mod-$name"
            cp -a "mod-$name"/mixins/* mods-stage/mixins/
          done

          # Generate native ports of compass_bar (0.2.0) and mod_menu (0.2.0)
          mkdir -p mods-stage/mixins/compass_bar mods-stage/mixins/mod_menu
          cat > mods-stage/mixins/compass_bar/horizon-mixin.toml <<'TOML'
          [mod]
          id = "compass_bar"
          version = "0.2.0"
          priority = 110

          [compatibility]
          horizon_revision = "142388e1c136e622652ec7505af15d8ad195e041"

          [[module]]
          id = "runtime"
          file = "crates/horizon-client/src/game.rs"
          name = "compass_bar"
          source = "runtime.rs"

          [[injection]]
          id = "list"
          kind = "HEAD"
          target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
          helper = "list.rs"
          bindings = [
            { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
          ]

          [[injection]]
          id = "hud"
          kind = "HEAD"
          target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
          helper = "hud.rs"
          bindings = [
            { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
            { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
            { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
          ]
          TOML

          cat > mods-stage/mixins/compass_bar/runtime.rs <<'RS'
          pub const ID: &str = "compass_bar";
          pub const NAME: &str = "Compass Enhanced";
          pub const VERSION: &str = "0.2.0";
          pub const DESCRIPTION: &str = "A compass bar at the top of the screen with degrees and N/NE/E/SE/S/SW/W/NW marks.";
          pub fn normalize_deg(yaw: f32) -> f32 { (yaw + 180.0).rem_euclid(360.0) }
          RS

          cat > mods-stage/mixins/compass_bar/list.rs <<'RS'
          fn compass_bar_listed(mods: &mut Vec<crate::game::native_hooks::NativeMod>) {
              use crate::game::compass_bar as cb;
              mods.push(crate::game::native_hooks::NativeMod {
                  id: cb::ID.into(),
                  title: format!("{} {}", cb::NAME, cb::VERSION),
                  description: cb::DESCRIPTION.into(),
                  keys: Vec::new(),
              });
          }
          RS

          cat > mods-stage/mixins/compass_bar/hud.rs <<'RS'
          fn compass_bar_hud(
              game: &mut crate::game::Game<'_>,
              batch: &mut horizon_client::hud::HudBatch,
              _corners: &mut horizon_client::extras_hud::Corners,
          ) {
              use crate::game::compass_bar as cb;
              use horizon_client::extras::Corner;
              if !game.native_on(cb::ID) || !game.native_corner_shown(Corner::TopLeft) {
                  return;
              }
              let Some(p) = game.native_player() else { return; };
              let deg = cb::normalize_deg(p.yaw).round() as i32 % 360;
              let label = format!("W  NW  N  NE  E  |  {deg:03}°  |  E  SE  S  SW  W");
              let w = game.native_text_width(&label) + 8.0;
              game.native_fill(batch, [140.0, 4.0, w, 12.0], 0x5000_0000);
              game.native_text(batch, &label, [144.0, 6.0], 0xFFFF55, true);
          }
          RS

          cat > mods-stage/mixins/mod_menu/horizon-mixin.toml <<'TOML'
          [mod]
          id = "mod_menu"
          version = "0.2.0"
          priority = 90

          [compatibility]
          horizon_revision = "142388e1c136e622652ec7505af15d8ad195e041"

          [[module]]
          id = "runtime"
          file = "crates/horizon-client/src/game.rs"
          name = "mod_menu_native"
          source = "runtime.rs"

          [[injection]]
          id = "list"
          kind = "HEAD"
          target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
          helper = "list.rs"
          bindings = [
            { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
          ]

          [[injection]]
          id = "command"
          kind = "HEAD"
          target = "horizon_client::game::native_hooks::Game<'_>::native_command"
          helper = "command.rs"
          bindings = [
            { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
            { name = "command", ty = "&str", value = "command" },
            { name = "ran", ty = "&mut bool", value = "&mut *ran" },
          ]
          TOML

          cat > mods-stage/mixins/mod_menu/runtime.rs <<'RS'
          pub const ID: &str = "mod_menu";
          pub const NAME: &str = "Mod Menu";
          pub const VERSION: &str = "0.2.0";
          pub const DESCRIPTION: &str = "Browse installed native & content mods on Android (/modmenu).";
          RS

          cat > mods-stage/mixins/mod_menu/list.rs <<'RS'
          fn mod_menu_listed(mods: &mut Vec<crate::game::native_hooks::NativeMod>) {
              use crate::game::mod_menu_native as mm;
              mods.push(crate::game::native_hooks::NativeMod {
                  id: mm::ID.into(),
                  title: format!("{} {}", mm::NAME, mm::VERSION),
                  description: mm::DESCRIPTION.into(),
                  keys: Vec::new(),
              });
          }
          RS

          cat > mods-stage/mixins/mod_menu/command.rs <<'RS'
          fn mod_menu_command(game: &mut crate::game::Game<'_>, command: &str, ran: &mut bool) {
              if *ran { return; }
              let c = command.trim().trim_start_matches('/');
              if c == "modmenu" || c.starts_with("modmenu ") {
                  game.native_chat("[Mod Menu] Installed (7): BiomeCompass 0.2.2, Carry Block 0.1.2, Compass Enhanced 0.2.0, FPS Counter 2.0.0, Mod Menu 0.2.0, SmartF3 0.1.0, TreeFall 0.3.0");
                  *ran = true;
              }
          }
          RS

      - name: Overlay Android Port Layer & Apply Mixins
        run: |
          cp -a horizon-android-fork/crates/horizon-android workspace-clean/crates/
          cp -a horizon-android-fork/packaging/android workspace-clean/packaging/
          for f in android_main.rs android_setup.rs android_ime.rs touch.rs; do
            [ -f "horizon-android-fork/crates/horizon-client/src/$f" ] && cp -a "horizon-android-fork/crates/horizon-client/src/$f" workspace-clean/crates/horizon-client/src/
          done
          python3 - <<'PY'
          import pathlib
          cargo_toml = pathlib.Path("workspace-clean/Cargo.toml")
          txt = cargo_toml.read_text()
          if '"crates/horizon-android"' not in txt:
              txt = txt.replace('"crates/horizon-client",', '"crates/horizon-client",\n    "crates/horizon-android",', 1)
          cargo_toml.write_text(txt)
          am = pathlib.Path("workspace-clean/crates/horizon-client/src/android_main.rs")
          if am.exists():
              t = am.read_text()
              if not pathlib.Path("workspace-clean/crates/horizon-mods/Cargo.toml").exists():
                  t = t.replace("static MOD_API_LEVEL: [u8; 27] = horizon_mods::api_level::MARK;", "")
                  t = t.replace("std::hint::black_box(&MOD_API_LEVEL);", "")
              am.write_text(t)
          PY
          git -C workspace-clean config user.email "ci@horizon.local"
          git -C workspace-clean config user.name "Horizon CI"
          git -C workspace-clean add -A
          git -C workspace-clean commit -m "chore: overlay horizon-android"
          REV=$(git -C workspace-clean rev-parse HEAD)
          python3 - "$REV" <<'PY'
          import sys, pathlib, re
          rev = sys.argv[1]
          for p in pathlib.Path("mods-stage/mixins").glob("*/horizon-mixin.toml"):
              txt = p.read_text().lstrip()
              txt = re.sub(r'horizon_revision\s*=\s*"[0-9a-f]{40}"', f'horizon_revision = "{rev}"', txt)
              p.write_text(txt)
          PY
          ./horizon-mixins/target/release/horizon-mixins apply \
            --workspace workspace-clean \
            --mods mods-stage/mixins \
            --out workspace-modded
          python3 - <<'PY'
          import pathlib
          root = pathlib.Path("workspace-modded")
          lib_rs = root / "crates/horizon-client/src/lib.rs"
          am = root / "crates/horizon-client/src/android_main.rs"
          if lib_rs.exists() and am.exists():
              lt, mt = lib_rs.read_text(), am.read_text()
              for d in ["pub mod biomecompass;", "pub mod biomecompass_item;"]:
                  if d in lt and d not in mt:
                      mt = d + "\n" + mt
              am.write_text(mt)
          PY

      - name: Build Android APK (aarch64-linux-android)
        run: |
          cd workspace-modded
          chmod +x packaging/android/build_apk.sh
          PROFILE=release ./packaging/android/build_apk.sh

      - name: Upload Modded APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-with-mods-apk
          path: workspace-modded/target/android/horizon.apk
          
